name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports: ["6379:6379"]
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do python -c "import socket; socket.create_connection(('localhost', 6379), 1)" && break; sleep 1; done
      - name: Load companies
        run: python -m ntk.seed
      - name: Tests
        run: pytest -q -rA 2>&1 | tee results-tests.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Retrieval check
        run: python scripts/diag.py
      - name: Benchmark (graph on vs off)
        run: python -m ntk.eval --out results/eval.json && cp results-tests.txt results/tests.txt
      - name: Start the app
        run: |
          nohup uvicorn ntk.api:app --host 127.0.0.1 --port 8000 > results/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/ask -H 'content-type: application/json' \
            -d '{"asker":"p_priya","question":"Why did Acme Corp invoice go up?"}' | head -c 600
      - name: Screenshots
        run: |
          python -m playwright install --with-deps chromium
          python scripts/shots.py http://localhost:8000 results/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the all-in-one image (same one Hugging Face runs)
        run: docker build -t need-to-know .
      - name: Run it and call the API
        run: |
          docker run -d --name ntk -p 7860:7860 need-to-know
          for i in $(seq 1 60); do curl -sf localhost:7860/api/health && break; sleep 2; done
          curl -sf -X POST localhost:7860/api/ask -H 'content-type: application/json' \
            -d '{"asker":"p_meera","question":"What does Acme Corp pay us?"}' | head -c 800
      - name: Logs
        if: always()
        run: docker logs ntk || true
